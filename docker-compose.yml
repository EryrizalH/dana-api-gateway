version: '3.8'

services:
  dana-gateway:
    build: .
    container_name: dana-gateway
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
    volumes:
      # Persist sesi login agar tidak hilang saat container restart
      - ./data:/app/data
